# Build larpgram iOS (Telegram fork) — unsigned IPA for AltStore/Sideloadly.
#
# Uses the SAME approach as upstream TelegramMessenger/Telegram-iOS CI (which is
# green): import the fake-codesigning cert, then build with the fake-codesigning
# profiles + appstore-configuration.json. No real Apple account, no ad-hoc hacks,
# no --disableProvisioningProfiles (that path fails extension provisioning).
name: build-ios

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select latest Xcode available on runner
        run: |
          set -e
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -z "$LATEST_XCODE" ]; then LATEST_XCODE="/Applications/Xcode.app"; fi
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install Bazelisk + pin Bazel 8.4.2
        run: |
          set -e
          brew install bazelisk
          BAZELISK="$(which bazelisk)"
          BIN_DIR="$(dirname "$BAZELISK")"
          if [ ! -e "$BIN_DIR/bazel" ]; then
            sudo ln -sf "$BAZELISK" "$BIN_DIR/bazel"
          fi
          bazel --version || true

      - name: Import fake-codesigning certificate
        run: |
          set -e
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build unsigned IPA (fake-codesigning, upstream approach)
        env:
          USE_BAZEL_VERSION: "8.4.2"
        run: |
          set -eo pipefail
          mkdir -p artifacts
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            --bazel="$(which bazel)" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
              --buildNumber=100001 \
              --configuration=release_arm64 \
              --configurationPath=build-system/appstore-configuration.json \
              --codesigningInformationPath=build-system/fake-codesigning \
              --outputBuildArtifactsPath=artifacts

      - name: List artifacts
        if: always()
        run: |
          ls -la artifacts || true
          find . -maxdepth 6 -name '*.ipa' 2>/dev/null || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: larpgram-ios-unsigned
          path: |
            artifacts/**/*.ipa
            artifacts/**/*.DSYMs.zip
          if-no-files-found: warn
          retention-days: 14

# Build larpgram iOS (Telegram fork) with repository fake code signing.
# Produces a fake-signed IPA artifact for TrollStore/sideload testing without Apple secrets.
name: build-ios-fake-signed

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number"
        required: false
        default: "100001"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      USE_BAZEL_VERSION: "8.4.2"

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select latest Xcode available on runner
        run: |
          set -e
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -z "$LATEST_XCODE" ]; then LATEST_XCODE="/Applications/Xcode.app"; fi
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install Bazelisk
        run: |
          set -e
          brew install bazelisk
          BAZELISK="$(which bazelisk)"
          BIN_DIR="$(dirname "$BAZELISK")"
          if [ ! -e "$BIN_DIR/bazel" ]; then
            sudo ln -sf "$BAZELISK" "$BIN_DIR/bazel"
          fi
          bazel --version || true

      - name: Validate fake-codesigning files
        run: |
          set -e
          test -f build-system/fake-codesigning/certs/SelfSigned.p12
          test -f build-system/fake-codesigning/certs/Public.cer
          test -f build-system/fake-codesigning/profiles/Telegram.mobileprovision
          find build-system/fake-codesigning/profiles -maxdepth 1 -name '*.mobileprovision' -print

      - name: Import fake-codesigning certificate
        run: |
          set -e
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build fake-signed IPA
        run: |
          set -eo pipefail
          mkdir -p artifacts
          BUILD_NUMBER="${{ github.event.inputs.build_number || '100001' }}"
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            --bazel="$(which bazel)" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
              --buildNumber="$BUILD_NUMBER" \
              --configuration=release_arm64 \
              --configurationPath=build-system/appstore-configuration.json \
              --codesigningInformationPath=build-system/fake-codesigning \
              --outputBuildArtifactsPath=artifacts

      - name: List artifacts
        if: always()
        run: |
          ls -la artifacts || true
          find . -maxdepth 6 -name '*.ipa' 2>/dev/null || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: larpgram-ios-fake-signed
          path: |
            artifacts/**/*.ipa
            artifacts/**/*.DSYMs.zip
          if-no-files-found: error
          retention-days: 14

# Build larpgram iOS (Telegram fork) on GitHub Actions.
#
# Strategy: use --codesigningInformationPath pointing to the fake-codesigning
# folder that ships with the repo, and --disableProvisioningProfiles so no real
# Apple certificates are needed. This produces an unsigned .ipa that can be
# side-loaded via AltStore/Sideloadly.
#
# Xcode/Bazel versions are pinned in versions.json. The GitHub runners rarely
# match exactly, so we pass --overrideXcodeVersion / --overrideBazelVersion.

name: build-ios

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select latest Xcode available on runner
        run: |
          set -e
          ls /Applications | grep -i '^Xcode' || true
          # Pick the newest installed Xcode; override checks in Make.py.
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -z "$LATEST_XCODE" ]; then LATEST_XCODE="/Applications/Xcode.app"; fi
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install Bazelisk (auto-picks Bazel from versions.json / .bazelversion)
        run: |
          set -e
          brew install bazelisk
          bazelisk version || true

      - name: Show runner info
        run: |
          sw_vers
          uname -a
          df -h /
          echo "Free disk:"
          df -h /
          python3 --version

      - name: Build unsigned IPA
        env:
          # Bazelisk resolves the version from versions.json (Make.py wires it).
          USE_BAZEL_VERSION: ""
        run: |
          set -eo pipefail
          mkdir -p artifacts
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            --bazel="$(which bazelisk)" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
              --buildNumber=100001 \
              --configuration=release_arm64 \
              --configurationPath=build-system/ci-configuration.json \
              --codesigningInformationPath=build-system/fake-codesigning \
              --disableProvisioningProfiles \
              --outputBuildArtifactsPath=artifacts

      - name: List artifacts
        if: always()
        run: |
          ls -la artifacts || true
          find build -maxdepth 4 -type f \( -name '*.ipa' -o -name '*.zip' -o -name '*.DSYMs*' \) 2>/dev/null || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: larpgram-ios-unsigned
          path: |
            artifacts/**/*.ipa
            artifacts/**/*.DSYMs.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.log
            **/bazel-out/**/*.log
          if-no-files-found: ignore
          retention-days: 7

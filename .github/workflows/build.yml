# Build larpgram iOS (Telegram fork) on GitHub Actions.
#
# Strategy: use --codesigningInformationPath pointing to the fake-codesigning
# folder that ships with the repo, and --disableProvisioningProfiles so no real
# Apple certificates are needed. This produces an unsigned .ipa that can be
# side-loaded via AltStore/Sideloadly.
#
# Xcode/Bazel versions are pinned in versions.json. The GitHub runners rarely
# match exactly, so we pass --overrideXcodeVersion / --overrideBazelVersion.

name: build-ios

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select latest Xcode available on runner
        run: |
          set -e
          ls /Applications | grep -i '^Xcode' || true
          # Pick the newest installed Xcode; override checks in Make.py.
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -z "$LATEST_XCODE" ]; then LATEST_XCODE="/Applications/Xcode.app"; fi
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install Bazelisk (auto-picks Bazel from versions.json / .bazelversion)
        run: |
          set -e
          brew install bazelisk
          # Make.py runs `bazel --version` and expects the actual Bazel version
          # ("bazel X.Y.Z"). Bazelisk only proxies when invoked as `bazel`
          # (argv[0]), so expose a `bazel` shim pointing at bazelisk.
          BAZELISK="$(which bazelisk)"
          BIN_DIR="$(dirname "$BAZELISK")"
          if [ ! -e "$BIN_DIR/bazel" ]; then
            sudo ln -sf "$BAZELISK" "$BIN_DIR/bazel"
          fi
          bazel --version || true

      - name: Show runner info
        run: |
          sw_vers
          uname -a
          df -h /
          echo "Free disk:"
          df -h /
          python3 --version

      - name: Regenerate profiles + throwaway codesign identity
        # rules_apple insists on a valid provisioning_profile and a matching
        # codesign identity in the keychain. The bundled example profiles are
        # from 2022 and reference Telegram's real Apple cert, which we cannot
        # replicate. This script:
        #   * pushes ExpirationDate to 2035,
        #   * injects the extra entitlements the app declares,
        #   * embeds a fresh self-signed cert into DeveloperCertificates,
        #   * writes that cert+key as a .p12 for the keychain-import step.
        # The resulting IPA needs to be re-signed by Sideloadly / AltStore
        # before it can be installed on a real device.
        run: |
          set -e
          chmod +x build-system/ci-refresh-profiles.sh
          bash build-system/ci-refresh-profiles.sh

      - name: Import throwaway identity into the login keychain
        run: |
          set -e
          KEYCHAIN="build.keychain"
          KEYCHAIN_PW="ci"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Add ours to the search list *first*, keep the default login keychain too.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security import build-system/example-configuration/certs/identity.p12 \
            -k "$KEYCHAIN" -P ci -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build unsigned IPA
        env:
          # Force the exact Bazel version the repo expects. Without this,
          # bazelisk picks the newest (9.x), where `sh_binary` is no longer
          # implicitly available (Telegram/BUILD:882 fails).
          USE_BAZEL_VERSION: "8.4.2"
        run: |
          set -eo pipefail
          mkdir -p artifacts
          # --disableProvisioningProfiles is a `generateProject` flag only.
          # For `build` we pass the same effect as a bazel define, plus point
          # codesigning at the checked-in fake certificates/profiles so the
          # signing step doesn't try to hit the real login keychain.
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            --bazel="$(which bazel)" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
              --buildNumber=100001 \
              --configuration=release_arm64 \
              --configurationPath=build-system/ci-configuration.json \
              --codesigningInformationPath=build-system/example-configuration \
              --outputBuildArtifactsPath=artifacts

      - name: List artifacts
        if: always()
        run: |
          ls -la artifacts || true
          find build -maxdepth 4 -type f \( -name '*.ipa' -o -name '*.zip' -o -name '*.DSYMs*' \) 2>/dev/null || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: larpgram-ios-unsigned
          path: |
            artifacts/**/*.ipa
            artifacts/**/*.DSYMs.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.log
            **/bazel-out/**/*.log
          if-no-files-found: ignore
          retention-days: 7
